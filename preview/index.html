<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Organizer Preview</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../frontend/viewer/organizer-viewer.css">
<style>
  html, body { margin: 0; height: 100%; background: #ece8e1; }
  #app { position: fixed; inset: 0; }
  #err { position: fixed; left: 16px; right: 16px; top: 70px; margin: 0; padding: 10px 12px; border-radius: 8px;
         background: #fff3ee; color: #8a2b12; font: 13px/1.45 Manrope, system-ui, sans-serif; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.1/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.1/examples/jsm/"
} }
</script>
</head>
<body>
<div id="app"></div>
<p id="err" hidden></p>
<script type="module">
// The organizer is drawn from layout.json and its STL files (the same files the GLB is built from).
// ?glb=<folder>/organizer.glb (as before) or ?layout=<folder>/layout.json
import { OrganizerViewer } from "../frontend/viewer/organizer-viewer.js";

const params = new URLSearchParams(location.search);
const glb = params.get("glb");
const layoutUrl = new URL(params.get("layout") || (glb ? glb.replace(/[^/]*$/, "layout.json")
  : "../generated_organizer/layout.json"), location.href);
const viewer = new OrganizerViewer(document.getElementById("app"));
try {
  const res = await fetch(layoutUrl);
  if (!res.ok) throw new Error(`${res.status} ${res.statusText}`);
  const layout = await res.json();
  document.title = `${layout.game || "Organizer"} · Inside the Box`;
  await viewer.load({ layout, stlUrl: (t) => new URL(t.stl, layoutUrl).href });
  // Optional deep link to a view, e.g. ?layout=…&view=top&explode=1&contents=1&select=2&filament=sage&box=0
  if (params.has("filament")) viewer.setPalette(params.get("filament"));
  if (params.has("box")) viewer.setShowBox(params.get("box") !== "0");
  if (params.has("contents")) viewer.setShowContents(params.get("contents") !== "0");
  if (params.has("explode")) viewer.setExplode(params.get("explode"), { instant: true });
  if (params.has("view") || params.has("explode")) viewer.setCameraPreset(params.get("view") || "iso", false);
  if (params.has("select")) viewer.select(Number(params.get("select")));
} catch (e) {
  const err = document.getElementById("err");
  err.textContent = `Could not load ${layoutUrl.pathname}: ${e.message || e}. Serve the repository over HTTP `
    + "(python -m http.server) and open /preview/?layout=<folder>/layout.json.";
  err.hidden = false;
}
</script>
</body>
</html>
